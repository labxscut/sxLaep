# Legacy project Pages URL redirects to: https://labxscut.github.io/tools/sxlaep/
#   - Markdown in repo tree: .../sxLaep/blob/main/docs/API_REFERENCE.md
#
# Triggers (automation):
#   - push to main when docs/**, sxlaep/**, scripts/generate_pydoc.py, or this file changes
#   - manual: Actions → "Publish GitHub Pages" → "Run workflow"
#
# One-time GitHub setup: Settings → Pages → Build and deployment → Source: GitHub Actions
#   (not "Deploy from a branch"). First run may ask to approve the github-pages environment.

name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sxlaep/**"
      - "scripts/generate_pydoc.py"
      - ".github/workflows/publish-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redirect legacy Pages URL
        run: |
          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="canonical" href="https://labxscut.github.io/tools/sxlaep/">
            <meta http-equiv="refresh" content="0; url=https://labxscut.github.io/tools/sxlaep/">
            <title>sxLaep documentation moved</title>
          </head>
          <body>
            <p>sxLaep documentation has moved to <a href="https://labxscut.github.io/tools/sxlaep/">LabX Tools</a>.</p>
            <script>location.replace("https://labxscut.github.io/tools/sxlaep/");</script>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
